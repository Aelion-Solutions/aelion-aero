name: AelionAero
version: ${version}
main: com.aelion.aero.bukkit.v1_13.AeroBukkitPlugin
api-version: "1.13"
author: Aelion Solutions
description: Connects this Bukkit/Spigot/Paper server to Aelion Cloud (1.13-1.16)
website: https://github.com/Aelion-Solutions/aelion-aero

commands:
  aes:
    description: Aelion Aero server commands
    permission: aelion.aero.info
    usage: /aes <help|info|reload|ping|servers>

permissions:
  aelion.aero.info:
    description: View Aelion Aero status
    default: true
  aelion.aero.admin:
    description: Reload config and admin actions
    default: op
  aelion.aero.create:
    description: Create servers/groups via panel (reserved)
    default: op
