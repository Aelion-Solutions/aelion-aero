name: AelionAero
main: com.aelion.aero.bungee.AeroBungeePlugin
version: ${version}
author: Aelion Solutions
description: Connects this BungeeCord/Waterfall proxy to Aelion Cloud
commands:
  ae:
    description: Aelion Aero commands
    aliases: [aec]
    permission: aelion.aero.info
permissions:
  aelion.aero.info:
    description: Use /ae help, info, ping, servers, backends, notify
    default: op
  aelion.aero.admin:
    description: Reload Aero config and admin actions
    default: op
    children:
      aelion.aero.info: true
  aelion.aero.create:
    description: Create servers via panel
    default: op
    children:
      aelion.aero.info: true
