name: AelionAero
version: ${version}
main: com.aelion.aero.paper.v26.AeroPaperPlugin
api-version: "26.1"
author: Aelion Solutions
description: Connects this Paper server to Aelion Cloud (26.x)
website: https://github.com/Aelion-Solutions/aelion-aero

# Commands are registered via Paper LifecycleEvents.COMMANDS (Brigadier) so bare /aes works.
permissions:
  aelion.aero.info:
    description: View Aelion Aero status
    default: true
  aelion.aero.admin:
    description: Reload config and admin actions
    default: op
  aelion.aero.create:
    description: Create servers/groups via panel (reserved)
    default: op
