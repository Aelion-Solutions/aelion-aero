name: Release

# release-please opens a Release PR on main (review/approve/merge).
# After merge it tags + creates the GitHub Release; we then attach plugin JARs.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    runs-on: [self-hosted, linux, aelion]
    timeout-minutes: 15
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # https://github.com/apps/aelion-bot — vars.APP_ID + secrets.APP_PRIVATE_KEY
      - name: Generate Aelion Bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json
          target-branch: main

  publish-jars:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: [self-hosted, linux, aelion]
    timeout-minutes: 30
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up JDKs
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            25
            21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          VERSION="${TAG##*v}"
          echo "Building with version=$VERSION"
          bash ./gradlew build --no-daemon -Pversion="$VERSION"
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}

      - name: Resolve version
        id: version
        run: |
          # Tags may be v0.1.0 or aelion-aero-v0.1.0 (release-please component tag).
          VERSION="${TAG##*v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ls -la \
            aero-bukkit-1_8/build/libs/ \
            aero-bukkit-1_13/build/libs/ \
            aero-paper-1_17/build/libs/ \
            aero-paper-1_21/build/libs/ \
            aero-paper-26/build/libs/ \
            aero-velocity/build/libs/ \
            aero-bungee/build/libs/ \
            aero-api/build/libs/ || true
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}

      - name: Generate Aelion Bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Upload JARs to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ steps.app-token.outputs.token }}
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          fail_on_unmatched_files: true
          files: |
            compat/aero-compat.yml
            aero-bukkit-1_8/build/libs/aero-bukkit-1_8-${{ steps.version.outputs.version }}.jar
            aero-bukkit-1_13/build/libs/aero-bukkit-1_13-${{ steps.version.outputs.version }}.jar
            aero-paper-1_17/build/libs/aero-paper-1_17-${{ steps.version.outputs.version }}.jar
            aero-paper-1_21/build/libs/aero-paper-1_21-${{ steps.version.outputs.version }}.jar
            aero-paper-26/build/libs/aero-paper-26-${{ steps.version.outputs.version }}.jar
            aero-velocity/build/libs/aero-velocity-${{ steps.version.outputs.version }}.jar
            aero-bungee/build/libs/aero-bungee-${{ steps.version.outputs.version }}.jar

      - name: Publish aero-api to GitHub Packages
        run: bash ./gradlew :aero-api:publish --no-daemon -Pversion="${{ steps.version.outputs.version }}"
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
