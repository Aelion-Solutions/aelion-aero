name: Publish aero-api

# Manual / on-demand publish of com.aelion.aero:aero-api to maven.aelion.solutions
# (also runs automatically from the Release workflow after a tagged release).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Override version (empty = gradle.properties)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  publish:
    runs-on: [self-hosted, linux, aelion]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish
        run: |
          if [ -n "$VERSION_OVERRIDE" ]; then
            bash ./gradlew :aero-api:publish --no-daemon -Pversion="$VERSION_OVERRIDE"
          else
            bash ./gradlew :aero-api:publish --no-daemon
          fi
        env:
          VERSION_OVERRIDE: ${{ inputs.version }}
          AELION_MAVEN_USER: ${{ secrets.AELION_MAVEN_USER }}
          AELION_MAVEN_TOKEN: ${{ secrets.AELION_MAVEN_TOKEN }}
