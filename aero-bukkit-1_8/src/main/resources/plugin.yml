name: AelionAero
version: ${version}
main: com.aelion.aero.bukkit.v1_8.AeroBukkitPlugin
author: Aelion Solutions
description: Connects this Bukkit/Spigot server to Aelion Cloud (1.8-1.12)
website: https://github.com/Aelion-Solutions/aelion-aero

commands:
  ae:
    description: Aelion Aero admin commands
    aliases: [aec]
    permission: aelion.aero.info
    usage: /ae <help|info|reload|ping|servers>

permissions:
  aelion.aero.info:
    description: View Aelion Aero status
    default: true
  aelion.aero.admin:
    description: Reload config and admin actions
    default: op
  aelion.aero.create:
    description: Create servers/groups via panel (reserved)
    default: op
